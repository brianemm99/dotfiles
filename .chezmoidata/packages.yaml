# Arch host packages, installed by .chezmoiscripts/run_onchange_before_10-packages.sh.tmpl.
# CLI tools that don't need system integration belong in mise instead.
pacman:
  # base
  - base-devel           # needed to build AUR packages
  - git
  - bash-completion
  # desktop
  - hyprland
  - hypridle
  - hyprlock
  - hyprpolkitagent
  - xdg-desktop-portal-hyprland
  - quickshell
  - iwd                  # Wi-Fi; the bar and settings talk to it directly
  # system daemons Quickshell's service modules talk to over D-Bus
  - upower               # Quickshell.Services.UPower: battery
  - power-profiles-daemon
  - framework-system     # framework_tool: battery charge limit (sudoers.d/framework-charge-limit)
  - bluetui              # Bluetooth TUI, opened from the bar
  # audio, media and brightness keys
  - pipewire
  - pipewire-pulse
  - wireplumber          # provides wpctl
  - brightnessctl
  - playerctl
  # apps
  - ghostty
  - discord
  - spotify-launcher
  - btop
  - fastfetch
  # containers
  - podman

aur:
  - brave-bin

# Not installed by the script: needs manual setup (2FA login).
# To install: sudo pacman -S tailscale && sudo systemctl enable --now tailscaled && sudo tailscale up
# Then, once, so Quickshell's Tailscale switch can run tailscale up/down without sudo:
#   sudo tailscale set --operator=$USER
manual:
  - tailscale
