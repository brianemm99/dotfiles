# Arch host packages, installed by .chezmoiscripts/run_onchange_before_10-packages.sh.tmpl.
# CLI tools that don't need system integration belong in mise instead.
pacman:
  # base
  - base-devel           # needed to build AUR packages
  - git
  - bash-completion
  # desktop
  - hyprland
  - hypridle
  - hyprlock
  - hyprpolkitagent
  - xdg-desktop-portal-hyprland
  - quickshell
  # audio, media and brightness keys
  - pipewire
  - pipewire-pulse
  - wireplumber          # provides wpctl
  - brightnessctl
  - playerctl
  # apps
  - ghostty
  - discord
  - spotify-launcher
  - btop
  - fastfetch
  # containers
  - podman

aur:
  - brave-bin

# Not installed by the script: needs manual setup (2FA login).
# To install: sudo pacman -S tailscale && sudo systemctl enable --now tailscaled && sudo tailscale up
manual:
  - tailscale
