# Start window numbering at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# vi for copy mode
setw -g mode-keys vi

# Increase history limit
set -g history-limit 10000

# 256 color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Status bar at the top
set -g status-position top

#set color not green
set -g status-style "bg=#8a0000,fg=#d0d0d0"

# matugen palette (generated; -q so a fresh machine without it is fine)
source-file -q ~/.cache/matugen/tmux-colors.conf

# set vi motions
set -g mode-keys vi
set -g status-keys vi
